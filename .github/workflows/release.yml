name: Release installers

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node morphodita4/scripts/check-release-tag.mjs

  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      checks: write

  build:
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bundles: deb
          - platform: windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: morphodita4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: morphodita4/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable installer
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: morphodita4/src-tauri -> target
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: morphodita4/dist
      - name: Build Linux sidecar from pinned MPL source
        if: matrix.platform == 'linux'
        run: sh scripts/build-sidecar-linux.sh
      - name: Verify and stage the standalone Windows sidecar
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $source = 'src-tauri/binaries/morphodita-server-x86_64-pc-windows-gnu.exe'
          $expected = '2f48fb060f0bf4668e4966fe22cce6a57408c44d3be32646a0d676080093e2fd'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant() -ne $expected) { throw 'Windows sidecar SHA-256 mismatch' }
          Copy-Item -LiteralPath $source -Destination 'src-tauri/binaries/morphodita-server-x86_64-pc-windows-msvc.exe'
      - name: Test the Rust library on native Windows
        if: matrix.platform == 'windows'
        working-directory: morphodita4/src-tauri
        run: cargo test --locked --lib
      - name: Build Linux DEB
        if: matrix.platform == 'linux'
        run: npm run tauri -- build --bundles deb --config '{"build":{"beforeBuildCommand":""}}'
      - name: Build Windows NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Content -LiteralPath ci.build.conf.json -Value '{"build":{"beforeBuildCommand":""}}' -Encoding utf8
          npx tauri build --bundles nsis --config ci.build.conf.json
      - name: Package installers, instructions, manifest and checksums
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: morphodita4/release-dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [validate, quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Validate both installers and create final checksums
        run: python morphodita4/scripts/package_release.py --verify release-assets
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python morphodita4/scripts/release_notes.py "$version" > release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Refusing to replace an already published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "MorphoDiTa Client $version" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
